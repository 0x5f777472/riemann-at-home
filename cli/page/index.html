<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Riemann@home · This Computer</title>
<style>
  html,body{margin:0;background:#000;color:#fff;font:bold 12px Arial,Helvetica,sans-serif;overflow:hidden}
  #screen{width:1000px;height:780px;margin:0 auto;position:relative;background:#000}
  #stars,#terrain,#overlay{position:absolute;left:0;top:0}
  .title{position:absolute;left:22px;top:12px;font:bold italic 34px "Arial Black",Arial,sans-serif;color:#5aa0ff;
         text-shadow:0 0 8px #1a4dff,2px 2px 0 #001a66;letter-spacing:1px}
  .title span{color:#ffd23f;text-shadow:0 0 8px #b36b00,2px 2px 0 #4d2a00}
  .sub{position:absolute;left:26px;top:54px;color:#7f9fdf;font-size:11px;letter-spacing:.5px}
  .nav{position:absolute;right:22px;top:18px;display:flex;gap:6px}
  .upd{position:absolute;right:22px;top:50px;max-width:420px;background:#ffd84a;color:#0b1c55;font:bold 12px Arial;padding:6px 10px;border-radius:4px}
  .upd code{font:bold 12px Menlo,monospace;background:rgba(11,28,85,.12);padding:1px 4px;border-radius:3px}
  .nav a{font:bold 11px Arial;letter-spacing:1px;text-transform:uppercase;text-decoration:none;padding:5px 10px;
         color:#b9d0ff;border:1px solid #2f5bd8;background:#000}
  .nav a.on{color:#fff;background:linear-gradient(#2f5bd8,#13308f)}
  .panel{position:absolute;border:1px solid rgba(120,160,255,.55);box-shadow:0 0 18px rgba(30,80,255,.25)}
  .panel.blue{background:rgba(25,45,170,.72)}.panel.green{background:rgba(20,140,60,.62)}.panel.navy{background:rgba(5,15,60,.72)}
  .panel h3{margin:0;padding:3px 8px;font-size:10px;color:#fff;background:rgba(0,0,0,.25);letter-spacing:1px;text-transform:uppercase}
  .kv{display:grid;grid-template-columns:118px 1fr;gap:2px 6px;padding:6px 9px}
  .k{color:#b9d0ff}.v{color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .green .k{color:#c9f5d4}
  .v.y{color:#ffd23f}.v.g{color:#7dff95}.v.r{color:#ff6b6b}
  .line{padding:6px 9px 0;color:#b9d0ff}
  .mod{padding:1px 9px;color:#7dff95;font-family:"Courier New",monospace;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:clip}
  #mods{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(var(--rows,11),13px);grid-auto-flow:column;column-gap:14px}
  #mods .mod{display:flex;gap:8px;transition:opacity .4s ease,transform .4s ease}
  #mods .mod.in{opacity:0;transform:translateX(-10px)}

  .bar{margin:6px 9px 4px;height:12px;background:#0a0f2a;position:relative;border:1px solid rgba(255,255,255,.3)}
  .bar i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,hsl(0,100%,55%),hsl(60,100%,55%),hsl(120,100%,50%),hsl(180,100%,50%),hsl(240,100%,62%),hsl(300,100%,60%)) 0 0/var(--bw,280px) 100% no-repeat}
  .pct{padding:0 9px;color:#ffd23f}
  .cap{position:absolute;left:96px;top:96px;color:#7f9fdf;font-size:10px;letter-spacing:.4px}
  .stat{position:absolute;left:0;right:0;bottom:10px;text-align:center;color:#7f9fdf;font-size:11px;letter-spacing:.5px}
  .stat b{color:#ffd23f}

</style></head>
<body><div id="screen">
  <canvas id="stars" width="1000" height="780"></canvas>
  <canvas id="terrain" width="1000" height="780"></canvas>

  <div class="title">Riemann<span>@</span>home</div>

  <div class="panel navy"  style="left:22px;top:556px;width:300px;height:76px"><h3 id="h3"></h3><div id="p3"></div></div>
  <div class="panel green" style="left:340px;top:556px;width:638px;height:186px;overflow:hidden"><h3 id="h2"></h3><div id="p2"></div></div>

       border:1px solid #2f5bd8;font:bold 11px Arial;color:#fff;white-space:nowrap;z-index:5"></div>

</div>
<script type="module">
// Riemann@home: this computer's build of the Lean proof of the Riemann hypothesis.
// Served by `riemann-at-home page` (localhost only): data.json (regenerated every minute), modules.txt,
// live.json (what is compiling now, every 2 s), times.json (how long each module took), POST mode.
const GLOBAL_URL = "https://riemann-at-home.github.io/riemann-at-home/";
const VIEW = "local";
document.title = "Riemann@home · This Computer";
const DATA = await (await fetch("data.json?" + Date.now())).json();
const T = DATA.terrain, N = T.n;
const fmt = n => n.toLocaleString("en-US");
const $ = id => document.getElementById(id);
const DPR = Math.max(1, window.devicePixelRatio || 1);
const CTX = {};
function ctx2d(id) {                       // draw at full screen resolution (Retina = 2x); sized once, never reset
  if (CTX[id]) return CTX[id];
  const cv = $(id); cv.style.width = "1000px"; cv.style.height = "780px";
  cv.width = 1000 * DPR; cv.height = 780 * DPR;
  const g = cv.getContext("2d"); g.scale(DPR, DPR); return CTX[id] = g;
}
let OFF = null;                            // offscreen canvas for full terrain redraws, swapped in with one drawImage
function offscreen() {
  if (!OFF) { const cv = document.createElement("canvas"); cv.width = 1000 * DPR; cv.height = 780 * DPR;
              OFF = cv.getContext("2d"); OFF.scale(DPR, DPR); }
  OFF.clearRect(0, 0, 1000, 780); return OFF;
}
const kv = rows => `<div class="kv">${rows.map(([k, v, c]) => `<div class="k">${k}</div><div class="v ${c||""}">${v}</div>`).join("")}</div>`;
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

// ---------- data ----------
let heights = b64(T.local_b64), maxVal = 255, axis = "size";
let caption = "this computer's build · one spike per compiled module · height = size of its compiled file";
if (/height=flat/.test(location.hash)) {   // every compiled module the same height: a spike just means "compiled"
  heights = heights.map(v => v ? 254 : 0); axis = "";
  caption = "this computer's build · one spike per compiled module · all the same height";
}

// Long module names keep their end (the part that differs), cut at a dot so no word is split. No ellipsis:
// the library tag in front (in its terrain color) says where in the proof it is; hover shows the full name.
const short = (n, max = 40) => {
  const p = n.split("."); p.shift();                       // library shown separately as a tag
  let s = p.pop() || n;
  while (p.length && s.length + p[p.length - 1].length + 1 <= max) s = p.pop() + "." + s;
  return s.length > max ? s.slice(0, max) : s;
};
const libTag = n => {                                       // "Development" in the color of its terrain label
  const L = (T && T.libraries) || [], top = n.split(".")[0], N0 = (T && T.n) || 1;
  const k = L.findIndex(x => x[0] === top); if (k < 0) return "";
  const end = k + 1 < L.length ? L[k + 1][1] : N0, hue = 300 * ((L[k][1] + end) / 2) / N0;
  return `<span class="lib" style="color:hsl(${hue},90%,68%)">${top}</span>`;
};
$("sub").textContent = "this computer's build of the AI proof of the Riemann hypothesis";
$("nav").innerHTML = `<a href="${GLOBAL_URL}" target="_blank" rel="noopener">Global dashboard →</a>`;
if (/stack=\d+/.test(location.hash) && VIEW === "local") { caption = "this computer's build · one bar per 5 neighbouring modules · grows as they compile"; axis = ""; }
$("cap").textContent = caption;

let active = T.active || [];
const names = active.map(i => null);   // names are filled from the module list order below when known
{
  const p = T.local_compiled / N;
  $("h1").textContent = "This computer's build";
  $("p1").innerHTML = kv([["Compiled", `${fmt(T.local_compiled)} of ${fmt(N)}`, "y"], ["Running for", "–"],
                          ["Speed", "measuring…"], ["Finishes", "–", "y"]]);
  $("h2").textContent = "Compiling now";
  $("p2").innerHTML = `<div class="line">${active.length} modules in progress<span class="blink">_</span></div><div id="mods"></div>`;
  $("h3").textContent = "Progress";
  $("p3").innerHTML = `<div class="bar"><i style="width:${Math.max(0.3, p * 100).toFixed(2)}%"></i></div>` +
                      `<div class="pct">${(p * 100).toFixed(2)}% of ${fmt(N)} modules</div>`;
  $("stat").innerHTML = `<b>${fmt(T.local_compiled)}</b> of ${fmt(N)} modules compiled on this computer · Lean 4.33.1 · archive 9631b4f0…c7fc`;
  $("mods").innerHTML = (T.active_names || []).map(n => `<div class="mod" title="${n}">${libTag(n)}${short(n, 30)}</div>`).join("");
}

// ---------- terrain geometry (shared by both views) ----------
// 175,187 = 733 x 239 exactly (both prime): 733 columns across, 239 modules deep, no spare spots.
// Each column is 239 neighbouring modules front to back, so the proof's libraries run left to right.
// #stack=5: every module the same-size block, stacked 5 high (733 across x 48 deep x 5 tall)
const STACK = Math.max(1, +((location.hash.match(/stack=(\d+)/) || [])[1] || 1));
const R = STACK > 1 ? Math.ceil(N / (733 * STACK)) : 239, C = STACK > 1 ? 733 : Math.ceil(N / R);
const left = 96, base = 444, spanX = 640, depthX = 230, depthY = 150, maxH = 170;
const sx = spanX / C, kx = depthX / R, ky = depthY / R;
const px = (c, r) => left + c * sx + r * kx, py = r => base - r * ky;
const cell = i => STACK > 1 ? [Math.floor(i / (R * STACK)), Math.floor((i % (R * STACK)) / STACK), i % STACK]
                            : [Math.floor(i / R), i % R, 0];
const grid = new Int32Array(C * R * STACK).fill(-1);          // (r, c, layer) -> module index
for (let i = 0; i < N; i++) { const [c, r, z] = cell(i); grid[(r * C + c) * STACK + z] = i; }
const LH = maxH / STACK;                                          // block height in stack mode
// Gravity: in each column the compiled modules stack from the floor up, in order; a module being
// compiled sits on top of its column's stack. LEVEL[i] = which layer module i is drawn on.
const LEVEL = new Int8Array(N).fill(-1);
function settle() {
  if (STACK < 2) return;
  const busy = new Set(active);
  for (let col = 0; col < C * R; col++) {
    let lv = 0;
    for (let z = 0; z < STACK; z++) { const i = grid[col * STACK + z]; if (i >= 0 && heights[i]) LEVEL[i] = lv++; }
    for (let z = 0; z < STACK; z++) { const i = grid[col * STACK + z]; if (i >= 0 && !heights[i]) LEVEL[i] = busy.has(i) ? lv++ : -1; }
  }
}
// Color: #color=spectrum (default: rainbow by position, like SETI's frequency axis),
// #color=library (one color per top-level library), #color=folder (one per second-level folder).
const COLOR = (location.hash.match(/color=(\w+)/) || [])[1] || "spectrum";
const groupStart = list => { const a = new Int32Array(N); let k = 0;
  for (let i = 0; i < N; i++) { while (k + 1 < list.length && list[k + 1][1] <= i) k++; a[i] = k; } return a; };
const LIB = groupStart(T.libraries), FOLD = T.folders ? groupStart(T.folders) : LIB;
const LIB_HUES = [0, 30, 55, 120, 175, 205, 235, 270, 300, 330, 90];
const hueOf = i => COLOR === "library" ? LIB_HUES[LIB[i] % LIB_HUES.length]
                 : COLOR === "folder" ? (FOLD[i] * 137.508) % 360        // golden-angle steps: neighbouring folders differ
                 : 300 * i / N;

function stars() {
  const g = ctx2d("stars");
  let s = 3; const rnd = () => (s = (s * 1103515245 + 12345) >>> 0) / 4294967296;
  for (let k = 0; k < 420; k++) { const a = 0.2 + 0.8 * rnd();
    g.fillStyle = `rgba(255,255,255,${a * a})`; g.fillRect(rnd() * 1000, rnd() * 780, rnd() < 0.08 ? 2 : 1, rnd() < 0.08 ? 2 : 1); }
}

const fail0 = v => v === 255;
let HL = -1;                                // highlighted library (hovering its label), -1 = none
const libEnd = k => k + 1 < T.libraries.length ? T.libraries[k + 1][1] : N;
const libHue = k => hueOf((T.libraries[k][1] + libEnd(k)) / 2);   // the label's color
const labelBoxes = [];                      // [library index, x0, y0, x1, y1] hover areas of the labels
let TG = null;                              // the base terrain canvas (full redraws + spikes folded in one by one)
function terrain() {
  TG = ctx2d("terrain");
  const g = offscreen(); labelBoxes.length = 0;
  g.fillStyle = "rgba(40,40,70,.55)";
  g.beginPath(); g.moveTo(px(0,0), py(0)); g.lineTo(px(C,0), py(0)); g.lineTo(px(C,R), py(R)); g.lineTo(px(0,R), py(R)); g.closePath(); g.fill();
  // Each spike is a little lit bar: bright face, darker left side, pale top cap; deeper rows sink into
  // a darker haze. That separation is what keeps neighbouring spikes from merging into one blob.
  const w = Math.max(1, sx * 0.85);           // about one module wide, with a hairline gap
  for (let r = R - 1; r >= 0; r--) {
    const depth = r / R, buckets = new Map(), todo = new Path2D();
    if (STACK > 1) for (let c = 0; c < C; c++) {     // stacked: one continuous bar per column
      const col = r * C + c; let k = 0, slots = 0, i0 = -1;
      for (let z = 0; z < STACK; z++) { const i = grid[col * STACK + z]; if (i < 0) continue; slots++; if (i0 < 0) i0 = i; if (heights[i]) k++; }
      if (i0 < 0) continue;
      if (!k || (HL >= 0 && LIB[i0] !== HL)) { todo.rect(px(c, r) - 0.4, py(r) - 0.4, 0.8, 0.8); continue; }   // hidden while another library is highlighted: plain floor
      const key = HL < 0 ? `${Math.round(hueOf(i0) / 5) * 5}` : LIB[i0] === HL ? `${Math.round(libHue(HL))}` : "f0";
      let b = buckets.get(key); if (!b) buckets.set(key, b = { face: new Path2D(), side: new Path2D(), cap: new Path2D() });
      const x = px(c, r), y = py(r), h = k * LH;
      b.side.rect(x - w / 2, y - h, w * 0.45, h);
      b.face.rect(x - w / 2 + w * 0.45, y - h, w * 0.55, h);
      // (stacked view: no pale top; it read as a stuck beacon)
    }
    if (STACK < 2) for (let c = 0; c < C; c++) for (let z = 0; z < STACK; z++) {
      const i = grid[(r * C + c) * STACK + z]; if (i < 0) continue;
      const v = heights[i];
      if (!v || (HL >= 0 && LIB[i] !== HL && !fail0(v))) { if (z === 0) todo.rect(px(c, r) - 0.4, py(r) - 0.4, 0.8, 0.8); continue; }   // still to do (or not highlighted): plain floor dot
      const fail = v === 255;
      const h = STACK > 1 ? LH - 1.2 : fail ? maxH : Math.max(3, v / maxVal * maxH);   // stacked: one equal block per module
      const key = fail ? "fail" : HL < 0 ? `${Math.round(hueOf(i) / 5) * 5}`
                               : LIB[i] === HL ? `${Math.round(libHue(HL))}` : "f0";   // highlighted: one color, the label's
      let b = buckets.get(key); if (!b) buckets.set(key, b = { face: new Path2D(), side: new Path2D(), cap: new Path2D() });
      const x = px(c, r), y = py(r) - (STACK > 1 ? LEVEL[i] : 0) * LH;
      b.side.rect(x - w / 2, y - h, w * 0.45, h);
      b.face.rect(x - w / 2 + w * 0.45, y - h, w * 0.55, h);
      b.cap.rect(x - w / 2, y - h, w, 1.5);
    }
    g.fillStyle = `rgba(150,170,255,${0.30 - 0.15 * depth})`; g.fill(todo);
    const L = 60 - 26 * depth;                                   // depth haze
    for (const [key, b] of buckets) {
      if (key === "fail") { g.fillStyle = "#fff"; g.shadowColor = "#f00"; g.shadowBlur = 8; g.fill(b.face); g.fill(b.side); g.shadowBlur = 0; continue; }
      const faded = key[0] === "f", hue = +key.replace("f", "");
      if (faded) {                                        // outside the highlighted library: dim grey
        continue;                                         // (not drawn: thousands of faint greys piled up into dark streaks)
      }
      g.fillStyle = `hsl(${hue},95%,${L - 24}%)`; g.fill(b.side);
      g.fillStyle = `hsl(${hue},100%,${L}%)`;     g.fill(b.face);
      g.fillStyle = `hsl(${hue},100%,${Math.min(92, L + 26)}%)`; g.fill(b.cap);
    }
  }
  g.globalAlpha = 1;
  // box + labels
  g.strokeStyle = "rgba(220,220,255,.55)"; g.lineWidth = 1;
  const corners = [[0,0],[C,0],[C,R],[0,R]];
  for (const h of [0, maxH + 8]) { g.beginPath();
    corners.forEach(([c, r], k) => { const x = px(c, r), y = py(r) - h; k ? g.lineTo(x, y) : g.moveTo(x, y); }); g.closePath(); g.stroke(); }
  for (const [c, r] of corners) { g.beginPath(); g.moveTo(px(c, r), py(r)); g.lineTo(px(c, r), py(r) - maxH - 8); g.stroke(); }
  g.fillStyle = "#e8ecff"; g.font = "bold 11px Arial";
  g.save(); g.translate(px(0, 0) - 22, py(0) - maxH / 2 + 24); g.rotate(-Math.PI / 2); g.fillText(axis, 0, 0); g.restore();
  g.save(); g.translate(px(C, 0) + 14, py(0) - 4); g.rotate(-Math.atan2(depthY, depthX)); g.fillText("modules →", 0, 0); g.restore();
  g.font = "bold 10px Arial";
  let lastX = -1e9;
  for (let k = 0; k < T.libraries.length; k++) {
    const [name, start] = T.libraries[k], end = k + 1 < T.libraries.length ? T.libraries[k + 1][1] : N;
    const x0 = px(cell(start)[0], 0), x1 = px(cell(end - 1)[0] + 1, 0), x = Math.max(x0, lastX + 8);
    if (x > x1 - 10 && end - start < N / 100) continue;
    g.strokeStyle = `hsl(${hueOf(start)},90%,60%)`; g.beginPath(); g.moveTo(x0, py(0) + 2); g.lineTo(x0, py(0) + 8); g.stroke();
    g.fillStyle = HL >= 0 && HL !== k ? `hsla(${hueOf((start + end) / 2)},90%,68%,.35)` : `hsl(${hueOf((start + end) / 2)},90%,68%)`;
    g.save(); g.translate(x + 2, py(0) + 16); g.rotate(0.45); g.fillText(name, 0, 0); g.restore();
    const tw = g.measureText(name).width;
    labelBoxes.push([k, x + 2, py(0) + 16, tw]);           // origin + width of the slanted text
    lastX = x + tw * Math.cos(0.45) * 0.55;
  }
  TG.save(); TG.setTransform(1, 0, 0, 1, 0, 0); TG.clearRect(0, 0, 1000 * DPR, 780 * DPR);   // swap in one step
  TG.drawImage(g.canvas, 0, 0); TG.restore();
}

// One spike drawn on its own (a module that just finished): same look as terrain(), `f` = 0..1 of its height.
function spike(g, i, v, f) {
  const [c, r] = cell(i), depth = r / R, L = 60 - 26 * depth, w = Math.max(1, sx * 0.85);
  const h = Math.max(3, v / maxVal * maxH) * f, x = px(c, r), y = py(r);
  if (h <= 0.2) return;
  if (HL >= 0 && LIB[i] !== HL) return;          // outside the highlighted library: not drawn
  const hue = HL >= 0 ? Math.round(libHue(HL)) : Math.round(hueOf(i) / 5) * 5;
  g.fillStyle = `hsl(${hue},95%,${L - 24}%)`; g.fillRect(x - w / 2, y - h, w * 0.45, h);
  g.fillStyle = `hsl(${hue},100%,${L}%)`;     g.fillRect(x - w / 2 + w * 0.45, y - h, w * 0.55, h);
  if (f >= 1) { g.fillStyle = `hsl(${hue},100%,${Math.min(92, L + 26)}%)`; g.fillRect(x - w / 2, y - h, w, 1.5); }   // pale top only once fully grown
}
// Modules that just finished: each grows in on the overlay (~600 ms), then is painted into the base canvas.
const GROW_MS = 1000, growing = [];            // {i, v, at}
let stackDirty = 0;
const FINV = new Map();                        // finished module -> its spike value (so its beacon can take that height)
const PENDING = new Map();                    // finished module -> {v, at}: switches to its real spike on the next beat
function addFinished(i, v, at) {
  if (i === undefined || heights[i] || PENDING.has(i) || FADE.some(f => f.i === i)) return;
  const t = performance.now();
  PENDING.set(i, {v, at: t + (CYCLE - t % CYCLE)});        // keep filling until the current cycle ends
}
let GROWN = 0;
function foldIn(s) {
  heights[s.i] = s.v; document.body.dataset.grown = ++GROWN;     // (count of spikes grown in, for headless checks)
  if (STACK > 1) { if (TG) addBlock(TG, s.i); return; }   // stacked view: one new block on top of its column
  if (TG) spike(TG, s.i, s.v, 1);
}
function addBlock(G, i) {                     // stacked view: grow i's column by one block, in place
  const [c, r] = cell(i), col = r * C + c; let k = 0, slots = 0;

  } catch (e) {}
}
if (LIVE) {
  fetch("modules.txt").then(r => r.text()).then(t => {
    NAMES = t.split("\n"); IDX = new Map(NAMES.map((n, i) => [n, i])); poll(); });
  $("h1").addEventListener("click", async e => {
    const m = e.target.dataset && e.target.dataset.m; if (!m || (L && m === L.mode)) return;
    try {
      const r = await fetch("mode", {method: "POST", headers: {"Content-Type": "application/json", "X-Riemann-At-Home": "1"},
                                     body: JSON.stringify({mode: m})});
      if (r.ok) { const d = await r.json(); d.finished = []; d.cursor = CURSOR; L = d; Lat = Date.now(); renderLive(); }
    } catch (e) {}
  });
  setInterval(poll, 1000);
  refreshTerrain(); setInterval(refreshTerrain, 60000);
}
</script></body></html>
